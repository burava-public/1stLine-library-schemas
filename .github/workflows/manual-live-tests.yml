name: Manual Live Schema Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: true
        default: main
        type: string
      package_dir:
        description: Optional package directory under providers/ to test only one schema package
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: manual-live-tests-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-structure:
    name: validate-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Validate structure
        run: pnpm validate:structure

  live-tests:
    name: live-tests
    runs-on: ubuntu-latest
    needs: validate-structure
    environment: public-schema-live-tests
    env:
      FIRSTLINE_BASE_URL: https://1stline.burava.com/api/schemas
      FIRSTLINE_TOKEN: ${{ secrets.FIRSTLINE_TOKEN }}
      FIRSTLINE_ORG_UID: ${{ secrets.FIRSTLINE_ORG_UID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Run package live tests
        if: ${{ inputs.package_dir != '' }}
        run: pnpm --dir "${{ inputs.package_dir }}" test

      - name: Run repository live tests
        if: ${{ inputs.package_dir == '' }}
        run: pnpm test
